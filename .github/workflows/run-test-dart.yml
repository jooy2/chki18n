name: run-test-dart

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - packages/dart/**
      - .github/workflows/run-test-dart.yml
  workflow_dispatch:

defaults:
  run:
    working-directory: packages/dart

jobs:
  run-test-dart:
    runs-on: ${{ matrix.os }}
    name: Test Dart ${{ matrix.sdk }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The floor the package declares, and whatever is current. Anything in
        # between is covered by the two.
        sdk: ['3.7.0', 'stable']
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        name: Setup Dart ${{ matrix.sdk }}
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      # Style, on one leg only. The formatter's own output changes between SDK
      # versions, so asking the floor to agree with code formatted by a current
      # SDK fails on a difference that means nothing.
      - name: Check formatting
        if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        if: matrix.sdk == 'stable'
        run: dart analyze --fatal-infos
      - name: Test
        run: dart test
