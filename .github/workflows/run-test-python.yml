name: run-test-python

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - packages/python/**
      - .github/workflows/run-test-python.yml
  workflow_dispatch:

defaults:
  run:
    working-directory: packages/python

jobs:
  run-test-python:
    runs-on: ${{ matrix.os }}
    name: Test Python ${{ matrix.python_version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python_version: ['3.10', '3.12', '3.14']
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        name: Setup Python ${{ matrix.python_version }}
        with:
          python-version: ${{ matrix.python_version }}
      # The package itself has no dependencies; `dev` is the linter, the type
      # checker and the test runner.
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest
