[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chki18n"
version = "1.0.0"
description = "Checks that your i18n translation files agree with each other — missing keys, untranslated values, broken placeholders. No dependencies, pure Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# 3.10 is where `X | Y` in annotations and `dataclass(slots=True)` both landed,
# and 3.9 reached end of life in October 2025.
requires-python = ">=3.10"
authors = [{ name = "CDGet", email = "jooy2.contact@gmail.com" }]
keywords = [
    "i18n",
    "internationalization",
    "translation",
    "locales",
    "validation",
    "verify",
    "lint",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# No runtime dependencies. This is a hard constraint, not a preference — it is
# why the argument parser, the ANSI colours and the JSON key scanner are all
# written out rather than pulled in.
dependencies = []

[project.scripts]
chki18n = "chki18n.cli:main"

[project.urls]
Homepage = "https://chki18n.cdget.com"
Documentation = "https://chki18n.cdget.com"
Repository = "https://github.com/jooy2/chki18n"
Issues = "https://github.com/jooy2/chki18n/issues"
Changelog = "https://chki18n.cdget.com/reference/changelog"

[project.optional-dependencies]
dev = ["mypy>=1.15", "pytest>=8.3", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/chki18n"]

[tool.hatch.build.targets.sdist]
# The tests travel with the source distribution; nothing else outside the
# package is worth shipping.
include = ["src/chki18n", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff's own
    "D",   # pydocstyle — everything public carries a docstring
]
ignore = [
    # A one-line summary is what these modules and functions have; a blank line
    # before a closing `"""` and a mandated period are noise.
    "D203",
    "D213",
    # Homoglyph detection, aimed at a Cyrillic `а` smuggled into an identifier.
    # This package compares Korean, Japanese and Cyrillic translations, and the
    # tests are written in them — every hit here is the data doing its job.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests describe themselves in their names.
"tests/*" = ["D103", "D100"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
files = ["src", "tests"]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
